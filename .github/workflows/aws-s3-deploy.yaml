# Workflow for deploying static content to S3
name: Deploy content to S3

on:
  push:
    branches: [ 'main' ]
    paths: 'packages/app/**'

permissions:
  contents: read

concurrency:
  group: 'aws-s3'
  cancel-in-progress: false

jobs:
  deploy-aws-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build:web

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_SECRET_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync packages/app/dist/ s3://${{ secrets.AWS_BUCKET }}

