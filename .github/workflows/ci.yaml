  #       run: npx playwright install --with-deps
  #
  #     - name: Run smoke tests
  #       env:
  #         BASE_URL: https://${{ steps.outputs.outputs.cloudfront_domain }}
  #       run: |
  #         echo "Testing ${BASE_URL}"
  #         npx playwright test --grep @smoke

  destroy:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WORKOUT_TRACKER_PREVIEW_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: OpenTofu init
        working-directory: ${{ env.TOFU_DIR }}
        run: tofu init

      - name: Destroy preview infra
        working-directory: ${{ env.TOFU_DIR }}
        run: |
          tofu destroy -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="environment=${ENVIRONMENT}" \
            -var="branch_name=pr-${{ github.event.pull_request.number }}"
