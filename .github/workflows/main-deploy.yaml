name: PR Preview Environment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: main-deployment
  cancel-in-progress: true

env:
  PROJECT_NAME: workout-tracker
  ENVIRONMENT: production
  TOFU_DIR: infra/production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: bun-setup
        background: true
        uses: oven-sh/setup-bun@v1

      - name: Setup Go
        uses: actions/setup-go@v5
        background: true
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Wait for Setup
        wait-all:

      - name: Install Dependencies
        background: true
        run: go mod tidy

      - name: Install dependencies and build
        id: bun-install
        background: true
        run: bun install

      - name: Setup OpenTofu
        background: true
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials (OIDC)
        background: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WORKOUT_TRACKER_PREVIEW_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for install
        wait-all:

      - name: Build Frontend
        background: true
        run: bun run build:web

      - name: Build Lambdas
        id: build-lambdas
        background: true
        uses: ./.github/actions/build-lambdas

      - name: OpenTofu init
        working-directory: ${{ env.TOFU_DIR }}
        run: |
          cat > backend.hcl << EOF
          key = "workout-tracker/main/terraform.tfstate"
          EOF

          tofu init -backend-config=backend.hcl

      - name: Wait for builds
        wait-all:

      - name: OpenTofu infra
        working-directory: ${{ env.TOFU_DIR }}
        run: |
          tofu apply -auto-approve

      - name: Capture infra outputs
        id: outputs
        working-directory: ${{ env.TOFU_DIR }}
        run: |
          echo "bucket_name=$(tofu output -raw bucket_name)" >> "$GITHUB_OUTPUT"

      - name: Sync app to preview S3
        run: |
          aws s3 sync packages/app/dist s3://${{ steps.outputs.outputs.bucket_name }} --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(tofu -chdir=${{ env.TOFU_DIR }} output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"

      - name: Add preview URL to PR body
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${{ steps.outputs.outputs.cloudfront_domain }}`;
            const marker = '<!-- preview-url-added -->';

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const currentBody = pr.body || '';

            if (currentBody.includes(url)) {
              core.info('Preview URL already exists in the PR body. Skipping.');
              return;
            }

            let updatedBody;
            if (currentBody.includes(marker)) {
              updatedBody = currentBody.replace(/Preview URL: .*/, `Preview URL: ${url}`)
            } else {
              updatedBody = `${currentBody.trimEnd()}
                ## Preview Environment

                Preview URL: ${url}

                ${marker}`;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: updatedBody,
            });

            core.info('Preview URL added to PR body.');
