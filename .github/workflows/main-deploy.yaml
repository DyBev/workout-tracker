name: PROD DEPOLY

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: main-deployment
  cancel-in-progress: false

env:
  PROJECT_NAME: workout-tracker
  ENVIRONMENT: production
  TOFU_DIR: infra/production

jobs:
  deploy:
    environment: prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        id: bun-setup
        background: true
        uses: oven-sh/setup-bun@v1

      - name: Setup Go
        uses: actions/setup-go@v5
        background: true
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Wait for Setup
        wait-all:

      - name: Install Dependencies
        background: true
        run: go mod tidy

      - name: Install dependencies and build
        id: bun-install
        background: true
        run: bun install

      - name: Setup OpenTofu
        background: true
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials (OIDC)
        background: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WORKOUT_TRACKER_PREVIEW_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Wait for install
        wait-all:

      - name: Build Frontend
        background: true
        run: bun run build:web

      - name: Build Lambdas
        id: build-lambdas
        background: true
        uses: ./.github/actions/build-lambdas

      - name: OpenTofu init
        working-directory: ${{ env.TOFU_DIR }}
        run: |
          cat > backend.hcl << EOF
          key = "workout-tracker/main/terraform.tfstate"
          EOF

          tofu init -backend-config=backend.hcl

      - name: Wait for builds
        wait-all:

      - name: OpenTofu infra
        working-directory: ${{ env.TOFU_DIR }}
        run: |
          tofu apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="project_name=${PROJECT_NAME}" \
            -var="environment=${ENVIRONMENT}" \
            -var="branch_name=${{ steps.preview.outputs.name }}" \
            -var="route53_zone_id=${{ secrets.ROUTE53_ZONE_ID }}" \
            -var="certificate_arn=${{ secrets.DOMAIN_CERTIFICATE_ARN }}"

      - name: Capture infra outputs
        id: outputs
        working-directory: ${{ env.TOFU_DIR }}
        run: |
          echo "bucket_name=$(tofu output -raw bucket_name)" >> "$GITHUB_OUTPUT"

      - name: Sync app build files to S3
        run: |
          aws s3 sync packages/app/dist s3://${{ steps.outputs.outputs.bucket_name }} --delete
